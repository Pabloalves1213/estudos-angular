<h1>Tarefas-local</h1>
<div class="button">
    <input type="text" placeholder="Digite uma nova tarefa" [(ngModel)]="novaTarefa">
    <button (click)="adicionarTarefas()" mat-button color="warn">Adicionar</button>

</div>
<ul>
    <li *ngFor="let tarefa of tarefas">
        <input type="checkbox"  [(ngModel)]="tarefa.concluida"> 
        <span [ngClass]="{ concluida: tarefa.concluida }">
            {{ tarefa.descricao }}
        </span>
    </li>
</ul>
