<h2 mat-dialog-title>Nova Tarefa</h2>

<mat-dialog-content>
    <mat-form-field appearance="fill">
        <mat-label>Descrição</mat-label>
        <input matInput [(ngModel)]="novaTarefa.descricao">
    </mat-form-field>
    <!-- <--alterar, colocar na mesma linha -->
    <mat-checkbox [(ngModel)]="novaTarefa.concluida">  
    </mat-checkbox>
    <mat-checkbox [(ngModel)]="novaTarefa.concluida">
       Pendente
    </mat-checkbox>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button mat-raised-button color="primary" (click)="salvar()">Salvar</button>
</mat-dialog-actions>
